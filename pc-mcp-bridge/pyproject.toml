[project]
name = "screen-viewer-mcp-bridge"
version = "0.1.0"
description = "MCP server proxying to the ScreenViewerOnTablet Android app"
requires-python = ">=3.10"
authors = [{name = "Charles Aebi"}]
license = {text = "TBD"}

dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_server", "http_client"]
